/* Shared bill maths: used by the app (browser) and by server.js, so both always agree. */
function freebies(lines, s) {
  if (!s.pizzaDrink) return [];
  const m = { S: "350ml", M: "500ml", L: "1 Litre" };
  const out = {};
  lines.forEach(l => { if (l.cat === "Pizza" && m[l.size]) { const k = "Free Drink " + m[l.size]; out[k] = (out[k] || 0) + l.qty; } });
  return Object.entries(out).map(([name, qty]) => ({ name, qty }));
}
function calcOrder(o, s) {

async function rpc(fn,args){
  let res;
  try{res=await SB.rpc(fn,args||{})}catch(e){throw new Error("Internet se rabta nahi. Connection check karein. Yeh kaam save nahi hua.")}
  if(res.error){
    const m=res.error.message||"Masla aaya";
    if(/PLAN_REQUIRED/.test(m)&&TOKEN){setTimeout(enter,0);throw new Error(m.replace("PLAN_REQUIRED: ",""))}
    if(/JWT|Login zaroori/i.test(m)&&TOKEN){logout(true);throw new Error("Dobara login karein.")}
    if(/Failed to fetch|NetworkError/i.test(m))throw new Error("Internet se rabta nahi. Connection check karein. Yeh kaam save nahi hua.");
    throw new Error(m);
  }
  return res.data;
}
/* old server paths mapped to database functions, so the screens stay the same */
async function api(path,method="GET",body){
  let m;
  if(path==="/api/state")return rpc("get_state");
  if(path==="/api/me")return rpc("me");
  if(path==="/api/orders")return rpc("create_order",{p:body});
  if((m=path.match(/^\/api\/orders\/(\d+)\/void$/)))return rpc("void_order",{p_no:+m[1],p_reason:body.reason});
  if(path==="/api/items"&&method==="POST")return rpc("save_item",{p:{...body,id:isUuid(body.id)?body.id:""}});
  if((m=path.match(/^\/api\/items\/([\w-]+)\/restock$/)))return rpc("restock",{p_id:m[1],p_qty:body.qty});
  if((m=path.match(/^\/api\/items\/([\w-]+)$/))&&method==="DELETE")return rpc("delete_item",{p_id:m[1]});
  if(path==="/api/settings")return rpc("save_settings",{p:body});
  if(path==="/api/users"&&method==="GET")return rpc("list_staff");
  if(path==="/api/users"&&method==="POST")return rpc("staff_create",{p_name:body.name,p_username:body.login,p_password:body.password,p_role:body.role});
  if((m=path.match(/^\/api\/users\/([\w-]+)\/active$/)))return rpc("set_staff_active",{p_user:m[1],p_active:!!body.active});
  if(path==="/api/billing/plans")return rpc("billing_info");
  if(path==="/api/billing/request")return rpc("request_payment",{p_plan:body.plan_id,p_method:body.method,p_txn:body.txn,p_sender:body.sender||""});
  if(path==="/api/logout"){await SB.auth.signOut();return{}}
  throw new Error("Unknown "+path);
}

function startSync(){
  if(ES){SB.removeChannel(ES);ES=null}
  const bid=S.business.id;
  const onChange=()=>{clearTimeout(PULLT);PULLT=setTimeout(async()=>{try{await pull();soft()}catch(e){}},350)};
  ES=SB.channel("biz-"+bid,{config:{presence:{key:DEVICE_KEY}}});
  ["orders","items","subs"].forEach(t=>ES.on("postgres_changes",{event:"*",schema:"public",table:t,filter:"business_id=eq."+bid},onChange));
  ES.on("postgres_changes",{event:"*",schema:"public",table:"businesses",filter:"id=eq."+bid},onChange);
  ES.on("presence",{event:"sync"},()=>{DEVICES=Object.keys(ES.presenceState()).length;chip()});
  ES.subscribe(async st=>{
    if(st==="SUBSCRIBED"){SYNC="live";chip();try{await ES.track({device:/Mobi|Android|iPhone/.test(navigator.userAgent)?"mobile":"desktop",at:Date.now()})}catch(e){}}
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){SYNC="down";chip()}
  });
}

const DO={
  async order(c,extra){
    const body={key:c.key,type:c.type,lines:c.lines.map(l=>({id:l.id,size:l.size,addons:l.addons||[],qty:l.qty})),disc:c.disc,discType:c.discType,pay:c.pay,cust:c.cust,...extra};
    if(MODE==="server"){const o=await api("/api/orders","POST",body);await pull();return o}
    const dup=S.orders.find(o=>o.key===c.key);if(dup)return dup;
    for(const l of c.lines){const it=S.items.find(i=>i.id===l.id);if(it&&it.track&&it.stock<l.qty)throw new Error(it.name+": stock sirf "+it.stock+" bacha hai.")}
    const o=calcOrder({id:uid(),key:c.key,no:++S.seq,ts:Date.now(),type:c.type,lines:c.lines.map(l=>({...l})),disc:c.disc,discType:c.discType,pay:c.pay,status:"paid",by:S.me.name,cust:(c.cust.phone||c.cust.name)?{...c.cust}:null},S.settings);
    if(c.pay==="cash"){o.cash=Math.round(+extra.cash||o.total);o.change=o.cash-o.total}else o.ref=extra.ref;
    o.lines.forEach(l=>{const it=S.items.find(i=>i.id===l.id);if(it&&it.track)it.stock-=l.qty});
    S.orders.push(o);saveLocal();return o;
  },
  async voidOrder(no,reason){
    if(MODE==="server"){await api("/api/orders/"+no+"/void","POST",{reason});return pull()}
    const o=S.orders.find(x=>x.no==no);o.status="void";o.voidReason=reason;o.voidBy=S.me.name;
    o.lines.forEach(l=>{const it=S.items.find(i=>i.id===l.id);if(it&&it.track)it.stock+=l.qty});saveLocal();
  },
  async saveItem(it){
    if(MODE==="server"){await api("/api/items","POST",it);return pull()}
    const ex=S.items.findIndex(i=>i.id===it.id);ex>=0?S.items[ex]=it:S.items.push(it);saveLocal();
  },
  async delItem(id){if(MODE==="server"){await api("/api/items/"+id,"DELETE");return pull()}S.items=S.items.filter(i=>i.id!==id);saveLocal()},
  async restock(id,q){if(MODE==="server"){await api("/api/items/"+id+"/restock","POST",{qty:q});return pull()}S.items.find(i=>i.id===id).stock+=q;saveLocal()},
  async settings(s){if(MODE==="server"){S.settings=await api("/api/settings","PUT",s);return}Object.assign(S.settings,s);saveLocal()}
};

function pickItem(id,fromScan,presetSize){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const multi=it.sizes&&it.sizes.length>1,adds=it.addons&&it.addons.length;
  if(!multi&&!adds)return addItem(it,it.sizes?it.sizes[0].l:null,fromScan,[]);

  const m=modal(`<h2>${esc(it.name)}</h2>${multi?`<div class="muted" style="font-size:12px;font-weight:600;margin-bottom:8px">Size chunein</div><div class="sizes">${it.sizes.map(z=>`<button type="button" data-sz="${esc(z.l)}"><span>${esc(z.l)}</span><b class="num">${pkr(z.p)}</b></button>`).join("")}</div>`:""}

  const upd=()=>{m.querySelectorAll("[data-sz]").forEach(b=>b.classList.toggle("on",b.dataset.sz===size));
    const base=size&&it.sizes?it.sizes.find(z=>z.l===size).p:(it.sizes?0:it.price);const extra=[...chosen].reduce((a,k)=>a+it.addons[k].p,0);
    m.querySelector("#pk_t").textContent=size||!it.sizes?pkr(base+extra):"Size chunein";m.querySelector("#pk_ok").disabled=!!it.sizes&&!size};
  m.querySelector("#x").onclick=close;
  m.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{size=b.dataset.sz;upd();if(!adds){close();addItem(it,size,fromScan,[])}});

function addItem(it,size,announce,addons){
  addons=(addons||[]).slice().sort();const key=addons.join(",");
  const c=UI.cart;const ex=c.lines.find(l=>l.id===it.id&&l.size===size&&(l.addons||[]).join(",")===key);
  if(it.track&&(ex?ex.qty:0)+1>it.stock){toast(it.name+": stock khatam",true);return}
  const z=size&&it.sizes?it.sizes.find(s=>s.l===size):null;
  const extra=addons.reduce((a,l)=>a+((it.addons||[]).find(x=>x.l===l)||{p:0}).p,0);
  ex?ex.qty++:c.lines.push({id:it.id,size,addons,name:it.name+(z?" ("+z.l+")":"")+(addons.length?" + "+addons.join(", "):""),price:(z?z.p:it.price)+extra,qty:1,cat:it.cat});
  renderCart();if(announce)toast("+ "+it.name+(size?" ("+size+")":""));

function scanCode(v){
  v=v.trim();if(!v)return;const lv=v.toLowerCase();
  let it=S.items.find(i=>i.barcode&&i.barcode===v)||S.items.find(i=>i.code.toLowerCase()===lv);
  if(it){if(UI.view!=="billing")go("billing");return pickItem(it.id,true)}
  /* code + size, e.g. PZ04M or SW032pc */
  for(const i of S.items){if(i.sizes&&lv.startsWith(i.code.toLowerCase())){const z=i.sizes.find(z=>z.l.toLowerCase()===lv.slice(i.code.length));if(z){if(UI.view!=="billing")go("billing");return i.addons&&i.addons.length?pickItem(i.id,true,z.l):addItem(i,z.l,true,[])}}}
  toast("Code nahi mila: "+v,true);
}

   <div class="full"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Add-ons (Extra Cheese +100, Extra Dip +50) · customer ek se zyada chun sakta hai</div>
    <div style="display:grid;gap:6px">${ad.map((a,k)=>`<div class="addrow"><input class="in" id="a_l${k}" placeholder="Add-on" value="${esc(a.l)}"><input class="in" id="a_p${k}" type="number" min="0" placeholder="+ Rate" value="${a.p}"></div>`).join("")}</div></div>
   <label class="f full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="i_track" ${it.track?"checked":""}> Stock count rakhna hai (drinks, packed items, bina size)</label>
   <label class="f">Stock${n?"":" (badalne ke liye Inventory)"}<input class="in" id="i_stock" type="number" value="${it.stock}" ${n||MODE==="local"?"":"disabled"}></label>
  </div><p id="err" style="color:var(--bad);min-height:18px"></p><div class="row" style="justify-content:space-between">${n?"<span></span>":`<button type="button" class="btn bad" id="del">Delete</button>`}<div class="row"><button type="button" class="btn" id="x">Wapas</button><button class="btn y" id="sv">Save</button></div></div></form>`);
  m.querySelector("#x").onclick=close;
  const d=m.querySelector("#del");d&&(d.onclick=()=>{if(d.dataset.sure){busy(d,async()=>{await DO.delItem(it.id);close();vMenu();toast("Item delete")})}else{d.dataset.sure=1;d.textContent="Pakka delete?"}});
  m.querySelector("#itf").onsubmit=e=>{e.preventDefault();const v=id=>m.querySelector(id).value.trim();const err=t=>m.querySelector("#err").textContent=t;
    const sizes=sz.map((_,k)=>({l:v("#z_l"+k),p:+v("#z_p"+k)})).filter(z=>z.l&&z.p>0);

   <div class="card"><h3>Naya: plans screen</h3><p class="muted">Register ke baad customer ko yeh screen milegi. Preview mein koi payment nahi hoti.</p><button class="btn y" id="pvPlans" type="button">Plans screen preview dekhein</button></div>`}
   <div class="card"><h3>Hardware</h3><p class="muted" style="line-height:1.6">Barcode scanner: USB scanner keyboard ki tarah kaam karta hai. Billing par kahin bhi scan karein, item cart mein aa jayega. Size wale item ka code + size bhi chalta hai (PZ04M, SW032pc).<br>Thermal printer: Windows mein printer driver install karein aur default bana dein, phir receipt par Print dabayen.</p></div>
  </div></div>`;
  $("#s_top").value=s.taxOnTop?"1":"0";$("#s_w").value=s.width;
  brandCard();rcCard();
  $("#sf").onsubmit=e=>{e.preventDefault();const v=id=>$(id).value;
    const ns={name:v("#s_name"),tagline:v("#s_tag"),address:v("#s_addr"),phone:v("#s_phone"),ntn:v("#s_ntn"),cashTax:+v("#s_cash")||0,cardTax:+v("#s_card")||0,taxOnTop:v("#s_top")==="1",deliveryFee:+v("#s_fee")||0,width:v("#s_w"),lowStock:+v("#s_low")||0,footer:v("#s_foot"),
      offer:{on:$("#o_on").checked,amt:+v("#o_amt")||0,cats:[...document.querySelectorAll("[data-oc]")].filter(x=>x.checked).map(x=>x.dataset.oc)},pizzaDrink:$("#o_pd").checked};
    busy($("#ssv"),async()=>{try{await DO.settings(ns);toast("Settings saved")}catch(e){$("#serr").textContent=e.message}})};
  if(MODE==="server"){
    const loadStaff=async()=>{try{const us=await api("/api/users");$("#staff").innerHTML=us.map(u=>`<div class="top-item"><div><b style="color:var(--fg)">${esc(u.name)}</b> <span class="pill ${u.role==="owner"?"y":"ok"}">${u.role}</span><div>${esc(u.login)}</div></div><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-upw="${u.id}" data-un="${esc(u.name)}">Password</button>${u.role!=="owner"?`<button class="btn sm" data-ua="${u.id}" data-a="${u.active?0:1}">${u.active?"Band karein":"Chalu karein"}</button>`:""}</div></div>`).join("");
      document.querySelectorAll("[data-upw]").forEach(b=>b.onclick=()=>{const m=modal(`<h2>${esc(b.dataset.un)}: naya password</h2><form id="pwf" style="display:flex;flex-direction:column;gap:12px"><input class="in" id="np" type="text" minlength="6" required autofocus placeholder="Naya password (6+)"><p id="pwe" style="color:var(--bad);margin:0"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="x">Wapas</button><button class="btn y">Save</button></div></form>`);
        m.querySelector("#x").onclick=close;m.querySelector("#pwf").onsubmit=async e=>{e.preventDefault();try{await rpc("staff_set_password",{p_user:b.dataset.upw,p_password:m.querySelector("#np").value});close();toast("Password badal gaya")}catch(x){m.querySelector("#pwe").textContent=x.message}}});
      document.querySelectorAll("[data-ua]").forEach(b=>b.onclick=()=>busy(b,async()=>{await api("/api/users/"+b.dataset.ua+"/active","POST",{active:b.dataset.a==="1"});loadStaff()}))}catch(e){$("#staff").textContent=e.message}};
    loadStaff();
    const rn=$("#renew");rn&&(rn.onclick=()=>plansScreen({business:S.business,me:S.me,sub:S.sub}));
    $("#uf").onsubmit=async e=>{e.preventDefault();try{await api("/api/users","POST",{name:$("#u_name").value,login:$("#u_login").value,password:$("#u_pw").value,role:$("#u_role").value});e.target.reset();$("#uerr").textContent="";loadStaff();toast("Staff add ho gaya")}catch(err){$("#uerr").textContent=err.message}};
  }else{
    $("#pvPlans").onclick=()=>plansScreen({business:{name:S.settings.name},me:{name:"Owner",role:"owner"},sub:{status:"none"}});
    $("#clrDemo").onclick=()=>{S.orders=S.orders.filter(o=>!o.demo);saveLocal();toast("Demo orders hat gaye")};
    $("#reset").onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Pakka? Dobara dabayen";return}S=seedLocal();saveLocal();UI.cart=newCart();render();toast("Reset ho gaya")};
  }
}

/* ============ subscription screens ============ */
let PLANPOLL=null,DEFERRED=null;
async function enter(){
  clearInterval(PLANPOLL);
  let me=await api("/api/me");
  if(!me.member){if(me.admin){location.href="admin.html";return}return noBusinessScreen(me)}
  if(!me.active)return noBusinessScreen(me);
  if(me.businessStatus!=="active"){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="AK47"><h3 style="text-align:center">Account band hai</h3><p class="muted">Yeh business account band kiya gaya hai. Support se rabta karein.</p><button class="btn" onclick="logout()">Logout</button></div></div>`;return}
  if(me.sub.status!=="active")return plansScreen(me);
  await pull();startSync();$("#root").innerHTML="";render();
}
function expiryPill(){if(!S||!S.sub||!S.sub.expires)return"";const d=Math.ceil((S.sub.expires-Date.now())/864e5);return d<=5?`<span class="pill warn">Plan ${d} din mein khatam</span>`:""}
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED=e;document.querySelectorAll(".inst").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true);toast("AK47 install ho gaya")});
function installBtn(){return MODE==="server"&&!isStandalone()?`<button type="button" class="btn sm inst" ${DEFERRED?"":"hidden"} onclick="doInstall()">Computer / mobile par install karein</button>`:""}
async function doInstall(){if(!DEFERRED)return;DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true)}
async function plansScreen(me){
  clearInterval(PLANPOLL);if(ES&&SB){SB.removeChannel(ES);ES=null}
  let info;
  if(MODE==="local")info={plans:[{id:"starter",name:"Starter",price:null,days:30,maxDevices:2,features:["1 counter + 1 mobile","Billing, receipt, menu","Daily sales report"]},{id:"business",name:"Business",price:null,days:30,maxDevices:5,highlight:true,features:["5 devices ek saath","Staff roles","Stock + customers","Live sync"]},{id:"yearly",name:"Business Yearly",price:null,days:365,maxDevices:5,features:["Business plan ki sab cheezen","Saal bhar ke liye"]}],payInfo:"PREVIEW\nJazzCash: 03xx-xxxxxxx (Account title: Power Pulse)\nYeh details aap Super Admin panel mein likhenge."};
  else{try{info=await api("/api/billing/plans")}catch(e){info={plans:[],payInfo:e.message}}}
  const sub=me.sub,owner=me.me.role==="owner",d=t=>new Date(t).toLocaleDateString("en-GB");
  const banner=sub.pending?`<div class="card" style="border-color:var(--warn)"><span class="pill warn">CHECK HO RAHI HAI</span><p style="margin:10px 0 0;line-height:1.6">Aap ki payment (ref <b>${esc(sub.pending.txn)}</b>, ${d(sub.pending.created)}) check ho rahi hai. Approve hote hi software khud khul jayega. Yeh screen khuli rehne dein.</p>${MODE==="local"?`<button class="btn y" id="fakeok" style="margin-top:12px">Preview: Super Admin ne approve kar diya</button>`:""}</div>`
    :sub.status==="expired"?`<div class="card" style="border-color:var(--bad)"><span class="pill bad">PLAN KHATAM</span><p style="margin:10px 0 0">Aap ka ${esc(sub.plan?sub.plan.name:"")} plan ${d(sub.expires)} ko khatam ho gaya. Data mehfooz hai, renew karte hi wapas mil jayega.</p></div>`
    :sub.status==="active"?`<div class="card"><span class="pill ok">ACTIVE</span> <span class="muted">${esc(sub.plan?sub.plan.name:"")} · ${d(sub.expires)} tak. Naya plan lene se din aage jur jayenge.</span></div>`:"";
  const rej=!sub.pending&&sub.lastRejected?`<div class="card" style="border-color:var(--bad);margin-top:10px"><span class="pill bad">PICHLI PAYMENT REJECT</span> <span class="muted">${esc(sub.lastRejected.admin_note||"Details match nahi huin.")}</span></div>`:"";
  $("#root").innerHTML=`<div class="plans-wrap">
   <div class="plans-top"><img src="${LOGO}" alt="AK47"><span class="sp" style="flex:1"></span>${installBtn()}<span class="who">${esc(me.business.name)} · ${esc(me.me.name)}</span>${sub.status==="active"?`<button class="btn sm" id="back">Software par wapas</button>`:""}<button class="btn sm" id="lo2">Logout</button></div>
   <h1 class="ph">Apna plan chunein</h1><p class="muted" style="margin:0 0 14px">Plan active hote hi billing, menu aur reports khul jayenge. Desktop aur mobile dono par chalega.</p>
   ${banner}${rej}
   ${owner?"":`<div class="card" style="margin-top:10px"><span class="muted">Plan sirf owner le sakta hai. Owner se kahen ke login kar ke plan lein.</span></div>`}
   <div class="plans">${info.plans.map(p=>`<div class="card plan ${p.highlight?"hl":""}">${p.highlight?'<span class="pill y" style="align-self:flex-start">Mashhoor</span>':""}<h3 style="margin:0">${esc(p.name)}</h3>
     <div class="price num">${p.price==null?"Qeemat jald":pkr(p.price)}</div><div class="muted">${p.days>=365?Math.round(p.days/365)+" saal":p.days+" din"}${p.maxDevices?" · "+p.maxDevices+" devices":" · unlimited devices"}</div>
     <ul>${(p.features||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
     <button class="btn y" data-plan="${esc(p.id)}" ${sub.pending||!owner?"disabled":""}>Yeh plan lein</button></div>`).join("")||`<div class="empty">Abhi koi plan available nahi. Support se rabta karein.</div>`}</div></div>`;
  const leavePreview=()=>{$("#root").innerHTML="";render();toast(MODE==="local"?"Preview khatam":"")};
  $("#lo2").onclick=()=>{clearInterval(PLANPOLL);MODE==="local"?leavePreview():logout()};
  const bk=$("#back");bk&&(bk.onclick=()=>MODE==="local"?leavePreview():enter());
  const fk=$("#fakeok");fk&&(fk.onclick=leavePreview);
  document.querySelectorAll("[data-plan]").forEach(b=>b.onclick=()=>payForm(info.plans.find(p=>p.id===b.dataset.plan),info,me));
  if(sub.pending&&MODE==="server")PLANPOLL=setInterval(async()=>{try{const m2=await api("/api/me");if(m2.sub.status==="active"&&!m2.sub.pending){clearInterval(PLANPOLL);toast("Plan active ho gaya");enter()}else if(!m2.sub.pending){clearInterval(PLANPOLL);plansScreen(m2)}}catch(e){}},10000);
}
function payForm(p,info,me){
  const m=modal(`<h2>${esc(p.name)} plan</h2>
   <div class="sum" style="font-size:16px;margin-bottom:12px"><span>Raqam</span><b class="num">${p.price==null?"Support se poochein":pkr(p.price)}</b></div>
   <div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Payment yahan bhejein</div><div class="payinfo">${esc(info.payInfo)}</div>
   <form id="pf" style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
    <label class="f">Kis tareeqe se bheji<select class="sel" id="p_m"><option>JazzCash</option><option>Easypaisa</option><option>Bank transfer</option><option>Cash (support ko)</option></select></label>
    <label class="f">Transaction ID / reference<input class="in" id="p_t" required minlength="4" autofocus></label>
    <label class="f">Bhejne wale ka naam / number<input class="in" id="p_s"></label>
    <p id="perr2" style="color:var(--bad);margin:0;min-height:18px"></p>
    <p class="muted" style="margin:0;font-size:12px">Payment hum khud check kar ke approve karte hain. Approve hone tak plan active nahi hoga.</p>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" id="x">Wapas</button><button class="btn y" id="psv">Payment ki details bhejein</button></div></form>`);
  m.querySelector("#x").onclick=close;
  m.querySelector("#pf").onsubmit=e=>{e.preventDefault();
    if(MODE==="local"){close();return plansScreen({...me,sub:{status:"none",pending:{txn:m.querySelector("#p_t").value,created:Date.now()}}})}
    busy(m.querySelector("#psv"),async()=>{try{
    const sub=await api("/api/billing/request","POST",{plan_id:p.id,method:m.querySelector("#p_m").value,txn:m.querySelector("#p_t").value,sender:m.querySelector("#p_s").value});
    close();toast("Details bhej di gayin");plansScreen({...me,sub})}catch(err){m.querySelector("#perr2").textContent=err.message}})};
}

/* ============ boot ============ */
(async()=>{
  const CFG=window.AK47_CONFIG;
  if(!inFrame&&CFG&&!window.supabase){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="AK47"><h3 style="text-align:center">Internet nahi hai</h3><p class="muted" style="line-height:1.6">AK47 sirf online chalta hai. Internet check kar ke dobara kholen.</p><button class="btn y" style="width:100%" onclick="location.reload()">Dobara try karein</button></div></div>`;return}
  if(!inFrame&&CFG&&window.supabase){MODE="server";SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true}})}
  if(MODE==="server"){
    try{navigator.serviceWorker&&navigator.serviceWorker.register("./sw.js")}catch(e){}
    const {data}=await SB.auth.getSession();
    if(data.session){TOKEN="sb";try{await enter();return}catch(e){if(!TOKEN)return;$("#root").innerHTML=`<div class="auth"><div class="card"><h3>Rabta nahi ho saka</h3><p class="muted">${esc(e.message)}</p><button class="btn y" onclick="location.reload()">Dobara try karein</button></div></div>`;return}}
    return authScreen();
  }
  try{S=JSON.parse(ls.get(KEY)||"null")}catch(e){S=null}
  if(!S||!S.items){S=seedLocal();saveLocal()}
  S.me={name:UI.role[0].toUpperCase()+UI.role.slice(1),role:UI.role};
  render();
})();
</script>
</body></html>
