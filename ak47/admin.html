<style>
/* Layout: operator shell — black sidebar + working canvas; billing = item wall left, ticket right; phone = stacked with bottom nav */
:root{
  --bg:#0c0b09; --panel:#16150f; --panel2:#201e16; --line:#2e2b20; --fg:#f5f1e3; --muted:#a59f88;
  --y:#ffc800; --y2:#ffdb4d; --ink:#151100; --ok:#45d08f; --bad:#ff6363; --warn:#ff9f1c;
  --f-display:"Poppins",system-ui,"Segoe UI",sans-serif;
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:#000;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.side img{width:150px;margin:4px 8px 18px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:0;background:none;text-align:left;color:var(--muted);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{color:var(--fg);background:var(--panel)}
.nav.on{background:var(--y);color:var(--ink)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px 12px;line-height:1.5}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:.3px;text-transform:uppercase}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.view{flex:1;overflow:auto;padding:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mobile-logo{display:none;height:30px}
.bnav{display:none}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.y{background:var(--y);color:var(--ink);border-color:var(--y)}
.btn.y:hover{background:var(--y2)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.in{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.in:focus{border-color:var(--y);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.3px}
.pill.ok{background:rgba(69,208,143,.14);color:var(--ok)}
.pill.bad{background:rgba(255,99,99,.14);color:var(--bad)}
.pill.warn{background:rgba(255,159,28,.15);color:var(--warn)}
.pill.y{background:rgba(255,200,0,.15);color:var(--y)}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:7px 8px;font-weight:600;color:var(--muted);font-size:13px}
.seg button.on{background:var(--y);color:var(--ink)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:32px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.dgrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.bar-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.top-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.top-item:last-child{border:0}
.meter{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--y)}

/* billing */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;height:100%}
.pos-left{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.tools{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.scan{position:relative}
.scan svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--y)}
.scan .in{padding-left:38px;border-color:#4a4120}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cat{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 15px;font-weight:600;color:var(--muted)}
.cat.on{background:var(--y);color:var(--ink);border-color:var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;align-content:start;padding-bottom:10px}
.tile{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .08s,border-color .1s}
.tile:hover{border-color:var(--y)}
.tile:active{transform:scale(.97)}
.tile .code{font-family:var(--f-mono);font-size:11px;color:var(--y);background:rgba(255,200,0,.1);padding:2px 6px;border-radius:5px;align-self:flex-start}
.tile .nm{font-weight:600;line-height:1.25;flex:1}
.tile .pr{font-family:var(--f-display);font-weight:700;font-size:21px}
.tile.out{opacity:.4}
.tile .st{position:absolute;top:10px;right:10px;font-size:10px}
.cart{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;overflow:hidden}
.cart-h{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cart-h .tt{display:flex;justify-content:space-between;align-items:center}
.cart-h .tt b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.lines{flex:1;overflow:auto;padding:6px 14px;min-height:120px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.line .n{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.line .u{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.line .t{font-weight:700;min-width:76px;text-align:right}
.cart-f{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.sum{display:flex;justify-content:space-between;color:var(--muted)}
.sum.total{color:var(--ink);background:var(--y);margin:2px -14px;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase}
.acts{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
.acts .btn{padding:12px 8px}
.disc{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.mbar{display:none}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.md{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px}
.md h2{margin:0 0 14px;font-family:var(--f-display);text-transform:uppercase;font-size:26px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.change{font-family:var(--f-display);font-size:30px;font-weight:700}

/* receipt */
.rc{background:#fff;color:#000;font-family:var(--f-mono);font-size:12px;padding:14px 12px;margin:0 auto;line-height:1.45}
.rc.w80{width:302px}.rc.w58{width:219px}
.rc .c{text-align:center}
.rc img{width:120px;filter:brightness(0);display:block;margin:0 auto 4px}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}
.rc .r{display:flex;justify-content:space-between;gap:6px}
.rc .big{font-size:15px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--y);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:10px;z-index:60}
#printArea{display:none}
@media print{
  @page{margin:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0}
  .rc{width:auto !important;padding:4mm}
}

/* responsive */
@media (max-width:1100px){.pos{grid-template-columns:minmax(0,1fr) 330px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mobile-logo{display:block}
  .top{padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px))}
  .top h1{font-size:20px}
  .view{padding:14px max(16px,env(safe-area-inset-right,0px)) 90px max(16px,env(safe-area-inset-left,0px))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:20;overflow-x:auto}
  .bnav .nav{flex:1;flex-direction:column;gap:3px;font-size:10px;padding:6px 4px;min-width:58px}
  .pos{grid-template-columns:1fr;height:auto}
  .grid{overflow:visible;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tools{grid-template-columns:1fr}
  .cart{max-height:none}
  .lines{max-height:none}
  .dgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .mbar{display:flex;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--y);color:var(--ink);border:0;border-radius:12px;padding:12px 16px;font-weight:700;justify-content:space-between;z-index:19;box-shadow:0 8px 24px rgba(0,0,0,.6)}
}
@media (max-width:860px){.toast{bottom:calc(132px + env(safe-area-inset-bottom,0px))}}
@media (max-width:460px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:24px}.acts{grid-template-columns:1fr 1fr}.acts .pay{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<style>
.wrap{max-width:1200px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hdr img{height:36px}
.hdr h1{font-family:var(--f-display);text-transform:uppercase;margin:0;font-size:26px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--y);color:var(--ink);border-color:var(--y)}
.plan-ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
textarea.in{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:13px}
.bad-t{color:var(--bad)}
</style>

async function rpc(fn,args){const r=await SB.rpc(fn,args||{});if(r.error){if(/Sirf Super Admin|JWT/.test(r.error.message)){login(r.error.message)}throw new Error(r.error.message)}return r.data}
async function api(p,method="GET",body){
  let m;const q=new URL(p,"http://x");
  if(q.pathname==="/api/admin/overview")return rpc("admin_overview");
  if(q.pathname==="/api/admin/payments")return rpc("admin_payments",{p_status:q.searchParams.get("status")||"pending"});
  if((m=q.pathname.match(/^\/api\/admin\/payments\/([\w-]+)\/(approve|reject)$/)))return rpc("admin_decide_payment",{p_id:m[1],p_approve:m[2]==="approve",p_note:(body&&body.note)||""});
  if(q.pathname==="/api/admin/businesses")return rpc("admin_businesses");
  if((m=q.pathname.match(/^\/api\/admin\/businesses\/([\w-]+)\/status$/)))return rpc("admin_set_status",{p_bid:m[1],p_status:body.status});
  if((m=q.pathname.match(/^\/api\/admin\/businesses\/([\w-]+)\/extend$/)))return rpc("admin_extend",{p_bid:m[1],p_plan:body.plan_id,p_days:body.days});
  if(q.pathname==="/api/admin/plans"&&method==="GET")return rpc("admin_plans");
  if(q.pathname==="/api/admin/plans")return rpc("admin_save_plan",{p:body});
  if(q.pathname==="/api/admin/platform"&&method==="GET")return rpc("admin_platform");
  if(q.pathname==="/api/admin/platform")return rpc("admin_save_platform",{p_pay_info:body.payInfo,p_trial_days:body.trialDays});
  throw new Error("Unknown "+p);
}
function login(err){
  $("#app").innerHTML=`<div class="auth"><form class="card" id="lf"><img src="${LOGO}" alt="AK47"><h3 style="text-align:center">Super Admin</h3>
   <label class="f">Username<input class="in" id="em" required autofocus autocomplete="username" autocapitalize="none"></label>
   <label class="f" style="margin-top:10px">Password<input class="in" id="k" type="password" required autocomplete="current-password"></label>
   <p class="bad-t" style="min-height:18px">${esc(err||"")}</p><button class="btn y" style="width:100%">Login</button></form></div>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const {error}=await SB.auth.signInWithPassword({email:$("#em").value.trim().toLowerCase().replace(/\s+/g,".")+"@users.ak47.app",password:$("#k").value});
    if(error)return login("Username ya password ghalat hai.");
    if(!(await rpc("is_admin")))return login("Yeh account Super Admin nahi hai.");main()};
}

  <div class="kpis">

      const {error}=await SB.auth.updateUser({password:p1});if(error){box.querySelector("#pwe").textContent=error.message;return}box.remove();toast("Password badal gaya")}};
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;main()});
  ({payments:tPay,businesses:tBiz,plans:tPlans,platform:tPlat})[TAB]();

  const plans=await api("/api/admin/plans");
  const card=(p,i)=>`<form class="card" data-pf="${i}" style="display:flex;flex-direction:column;gap:10px">
    <div class="fgrid"><label class="f">ID<input class="in" name="id" value="${esc(p.id||"")}" ${p.id?"readonly":""} placeholder="e.g. basic"></label><label class="f">Naam<input class="in" name="name" value="${esc(p.name||"")}" required></label>
    <label class="f">Qeemat PKR (khali = "Qeemat jald")<input class="in" name="price" type="number" min="0" value="${p.price??""}"></label><label class="f">Din<input class="in" name="days" type="number" min="1" value="${p.days||30}"></label>
    <label class="f">Devices (khali = unlimited)<input class="in" name="maxDevices" type="number" min="1" value="${p.maxDevices??""}"></label><label class="f">Tarteeb<input class="in" name="sort" type="number" value="${p.sort??i}"></label></div>
    <label class="f">Features (har line ek)<textarea class="in" name="features">${esc((p.features||[]).join("\n"))}</textarea></label>
    <div class="row"><label class="f" style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" name="highlight" ${p.highlight?"checked":""}> Highlight</label><label class="f" style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" name="active" ${p.active!==false?"checked":""}> Dikhao</label><span style="flex:1"></span><button class="btn y">Save</button></div></form>`;
  $("#tab").innerHTML=`<p class="muted">Qeematen abhi tay nahi hain. Jab tay hon, yahan likh dein. Customer ko fauran nazar aayengi.</p><div class="plan-ed">${plans.map(card).join("")}${card({},plans.length)}</div>`;
  document.querySelectorAll("[data-pf]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const v=n=>f.elements[n];
    try{await api("/api/admin/plans","POST",{id:v("id").value,name:v("name").value,price:v("price").value,days:v("days").value,maxDevices:v("maxDevices").value,sort:v("sort").value,features:v("features").value,highlight:v("highlight").checked,active:v("active").checked});toast("Plan saved");main()}catch(err){toast(err.message,true)}});
}
async function tPlat(){
  const p=await api("/api/admin/platform");
  $("#tab").innerHTML=`<form class="card" id="plf" style="display:flex;flex-direction:column;gap:12px;max-width:640px"><h3>Customer ko payment kahan bhejni hai</h3>
   <label class="f">Payment details (plans screen par dikhti hain)<textarea class="in" id="pi" style="min-height:160px">${esc(p.payInfo)}</textarea></label>
   <label class="f" style="max-width:220px">Free trial (din, 0 = koi trial nahi)<input class="in" id="td" type="number" min="0" max="90" value="${p.trialDays}"></label>
   <div class="row" style="justify-content:flex-end"><button class="btn y">Save</button></div></form>`;
  $("#plf").onsubmit=async e=>{e.preventDefault();try{await api("/api/admin/platform","POST",{payInfo:$("#pi").value,trialDays:+$("#td").value});toast("Saved")}catch(err){toast(err.message,true)}};
}
(async()=>{const C=window.AK47_CONFIG;SB=window.supabase.createClient(C.url,C.key);const {data}=await SB.auth.getSession();
  if(data.session&&await SB.rpc("is_admin").then(r=>r.data).catch(()=>false))main();else login()})();
</script>
