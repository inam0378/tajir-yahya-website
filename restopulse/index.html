html[data-style="glass"] .card,html[data-style="glass"] .cart,html[data-style="glass"] .tile,html[data-style="glass"] .top,html[data-style="glass"] .side,html[data-style="glass"] .bnav,html[data-style="glass"] .md,html[data-style="glass"] .cart-f,html[data-style="glass"] .cat{background:color-mix(in srgb,var(--panel) 52%,transparent)!important;backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);border-color:color-mix(in srgb,var(--fg) 14%,transparent)}
html[data-style="glass"] .cat.on{background:var(--y)!important}
html[data-style="neu"] body,html[data-style="neu"] .main,html[data-style="neu"] .top,html[data-style="neu"] .side,html[data-style="neu"] .bnav{background:var(--bg)!important}
html[data-style="neu"] .card,html[data-style="neu"] .cart,html[data-style="neu"] .tile,html[data-style="neu"] .md,html[data-style="neu"] .cat,html[data-style="neu"] .btn,html[data-style="neu"] .seg{background:var(--bg);border-color:transparent!important;box-shadow:6px 6px 14px var(--sh-d),-6px -6px 14px var(--sh-l)}
html[data-style="neu"] .cart-f{background:var(--bg)}
html[data-style="neu"] .in,html[data-style="neu"] .sel{background:var(--bg);border-color:transparent;box-shadow:inset 3px 3px 7px var(--sh-d),inset -3px -3px 7px var(--sh-l)}
html[data-style="neu"] .tile:active,html[data-style="neu"] .btn:active{box-shadow:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l)}
html[data-style="neu"] .btn.y,html[data-style="neu"] .cat.on,html[data-style="neu"] .seg button.on,html[data-style="neu"] .nav.on{box-shadow:4px 4px 10px var(--sh-d),-4px -4px 10px var(--sh-l)}
html[data-style="flat"] .card,html[data-style="flat"] .cart,html[data-style="flat"] .tile,html[data-style="flat"] .md{border-color:transparent;border-radius:6px;box-shadow:none}
html[data-style="flat"] .btn,html[data-style="flat"] .cat,html[data-style="flat"] .seg,html[data-style="flat"] .seg button,html[data-style="flat"] .in,html[data-style="flat"] .sel,html[data-style="flat"] .nav{border-radius:4px}
html[data-style="flat"] .sum.total{border-radius:0}
.stylepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stylepick button{border:2px solid var(--line);border-radius:12px;padding:10px 6px;background:var(--panel2);font-weight:600;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.stylepick button.on{border-color:var(--y)}
.stylepick i{display:block;width:100%;height:34px;border-radius:8px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.sw button.on{outline:2px solid var(--fg);outline-offset:2px}
.sw input[type=color]{width:38px;height:32px;border:0;background:none;padding:0}
.logobox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logobox .lp{width:120px;height:64px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.logobox .lp img{max-width:100%;max-height:100%}
.rcprev{background:var(--bg);border-radius:12px;padding:14px;max-height:520px;overflow:auto}
.rc.fs{font-size:10.5px}.rc.fm{font-size:12px}.rc.fl{font-size:13.5px}
.rc img.ls{width:80px}.rc img.lm{width:120px}.rc img.ll{width:170px}
.rc .nobold{font-weight:400}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px}
.adds{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.adds label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.adds label b{margin-left:auto}
.sizes button.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
@media (max-width:520px){.stylepick{grid-template-columns:1fr 1fr}}
html[data-mode="light"] .tile .code,html[data-mode="light"] .pill.y{color:var(--fg);background:color-mix(in srgb,var(--y) 35%,transparent)}
html[data-mode="light"] .scan svg{color:var(--fg)}
html[data-mode="light"] .scan .in{border-color:var(--line)}
.rc img.custom{filter:grayscale(1) contrast(1.15)}
.plans-wrap{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.plans-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.plans-top img{height:40px}
.ph{font-family:var(--f-display);font-size:34px;font-weight:700;text-transform:uppercase;margin:0 0 4px;text-wrap:balance}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.plan{display:flex;flex-direction:column;gap:10px;padding:22px}
.plan.hl{border-color:var(--y);box-shadow:0 0 0 1px var(--y) inset}
.plan .price{font-family:var(--f-display);font-weight:700;font-size:36px;line-height:1}
.plan ul{margin:4px 0 8px;padding-left:18px;line-height:1.7;color:var(--fg);flex:1}
.plan .btn{padding:12px}
.payinfo{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--y);border-radius:10px;padding:12px;line-height:1.6;font-family:var(--f-mono);font-size:13px}
.warnbar{display:inline-flex}

function legacyFree(lines, s) {

  const m = { S: "350ml", M: "500ml", L: "1 Litre" };
  const out = {};

  return Object.entries(out).map(([name, qty]) => ({ name, qty }));
}
const freebies = legacyFree;
function pad2(n) { return String(n).padStart(2, "0"); }
function offerLive(o, now) {
  if (!o || o.on === false) return false;
  const d = now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate());
  const hm = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  if (o.start && d < o.start) return false;
  if (o.end && d > o.end) return false;
  if (Array.isArray(o.days) && o.days.length && !o.days.map(Number).includes(now.getDay())) return false;
  if (o.from && o.to) {
    if (o.from <= o.to) { if (!(hm >= o.from && hm < o.to)) return false; }
    else if (!(hm >= o.from || hm < o.to)) return false;
  }
  return true;
}
function evalOffers(lines, s, items, now) {
  now = now || new Date();
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const applied = [], free = []; let total = 0;
  (s.offers || []).forEach(o => {
    if (!offerLive(o, now) || sub < (Number(o.minBill) || 0)) return;

    let elig = 0, units = 0, amt = 0;

      if (hit && l.price > 0) {

      }
    });
    if (elig <= 0) return;
    if (o.type === "pct") amt = elig * Math.min(v, 100) / 100;
    else if (o.type === "flat" && scope === "bill") amt = Math.min(v, elig);
    else if (o.type === "free") {
      amt = 0;
      const it = (items || []).find(i => o.free && i.id === o.free.id);

function calcOrder(o, s, ctx) {
  const lines = o.lines || [];
  const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
  const off = s.offer || {};
  let legacy = 0;
  if (off.on) lines.forEach(l => { if ((off.cats || []).includes(l.cat) && l.price > 0) legacy += Math.min(Number(off.amt) || 0, l.price) * l.qty; });
  const ev = ctx && ctx.items ? evalOffers(lines, s, ctx.items, ctx.now) : { discount: 0, applied: [], free: [] };
  const offd = Math.min(ev.discount, sub - legacy);

  disc = Math.min(Math.max(disc, 0), sub - legacy - offd);

  const base = sub - legacy - offd - disc;

async function rpc(fn,args){
  let res;
  try{res=await SB.rpc(fn,args||{})}catch(e){throw new Error("Internet se rabta nahi. Connection check karein. Yeh kaam save nahi hua.")}
  if(res.error){
    const m=res.error.message||"Masla aaya";
    if(/PLAN_REQUIRED/.test(m)&&TOKEN){setTimeout(enter,0);throw new Error(m.replace("PLAN_REQUIRED: ",""))}
    if(/JWT|Login zaroori/i.test(m)&&TOKEN){logout(true);throw new Error("Dobara login karein.")}
    if(/Failed to fetch|NetworkError/i.test(m))throw new Error("Internet se rabta nahi. Connection check karein. Yeh kaam save nahi hua.");
    throw new Error(m);
  }
  return res.data;
}
/* old server paths mapped to database functions, so the screens stay the same */
async function api(path,method="GET",body){
  let m;
  if(MODE==="local"&&path.startsWith("/api/users")){
    S.users=S.users||[];
    if(path==="/api/users"&&method==="GET")return S.users.map(u=>({id:u.id,name:u.name,login:u.login,role:u.role,active:u.active}));
    if(path==="/api/users"&&method==="POST"){
      if(!/^[a-z0-9._-]{3,30}$/.test(body.login))throw new Error("Username 3 se 30 huroof ka ho (a-z, 0-9, . _ -).");
      if((body.password||"").length<6)throw new Error("Password kam az kam 6 huroof ka ho.");
      if(S.users.some(u=>u.login===body.login))throw new Error("Yeh username pehle se istemal ho raha hai.");
      S.users.push({id:uid(),name:body.name||body.login,login:body.login,password:body.password,role:body.role==="manager"?"manager":"cashier",active:true});saveLocal();return{ok:true}}
    if((m=path.match(/^\/api\/users\/([\w-]+)\/active$/))){const u=S.users.find(x=>x.id===m[1]);if(u&&u.role!=="owner")u.active=!!body.active;saveLocal();return{ok:true}}
    if((m=path.match(/^\/api\/users\/([\w-]+)\/password$/))){if((body.password||"").length<6)throw new Error("Password kam az kam 6 huroof ka ho.");const u=S.users.find(x=>x.id===m[1]);if(u)u.password=body.password;saveLocal();return{ok:true}}
  }
  if(path==="/api/state")return rpc("get_state");
  if(path==="/api/me")return rpc("me");
  if(path==="/api/orders")return rpc("create_order",{p:body});
  if((m=path.match(/^\/api\/orders\/(\d+)\/void$/)))return rpc("void_order",{p_no:+m[1],p_reason:body.reason});
  if(path==="/api/items"&&method==="POST")return rpc("save_item",{p:{...body,id:isUuid(body.id)?body.id:""}});
  if((m=path.match(/^\/api\/items\/([\w-]+)\/restock$/)))return rpc("restock",{p_id:m[1],p_qty:body.qty});
  if((m=path.match(/^\/api\/items\/([\w-]+)$/))&&method==="DELETE")return rpc("delete_item",{p_id:m[1]});
  if(path==="/api/settings")return rpc("save_settings",{p:body});
  if(path==="/api/users"&&method==="GET")return rpc("list_staff");
  if(path==="/api/users"&&method==="POST")return rpc("staff_create",{p_name:body.name,p_username:body.login,p_password:body.password,p_role:body.role});
  if((m=path.match(/^\/api\/users\/([\w-]+)\/password$/)))return rpc("staff_set_password",{p_user:m[1],p_password:body.password});
  if((m=path.match(/^\/api\/users\/([\w-]+)\/active$/)))return rpc("set_staff_active",{p_user:m[1],p_active:!!body.active});
  if(path==="/api/billing/request")return rpc("request_payment",{p_plan:body.plan_id,p_method:body.method,p_txn:body.txn,p_sender:body.sender||""});
  if(path==="/api/logout"){await SB.auth.signOut();return{}}
  throw new Error("Unknown "+path);
}

const DEVICE_KEY=(()=>{let k=ls.get("ak47.device");if(!k){k=uid();ls.set("ak47.device",k)}return k})();
function startSync(){
  if(ES){SB.removeChannel(ES);ES=null}
  const bid=S.business.id;
  const onChange=()=>{clearTimeout(PULLT);PULLT=setTimeout(async()=>{try{await pull();soft()}catch(e){}},350)};
  ES=SB.channel("biz-"+bid,{config:{presence:{key:DEVICE_KEY}}});
  ["orders","items","subs"].forEach(t=>ES.on("postgres_changes",{event:"*",schema:"public",table:t,filter:"business_id=eq."+bid},onChange));
  ES.on("postgres_changes",{event:"*",schema:"public",table:"businesses",filter:"id=eq."+bid},onChange);
  ES.on("presence",{event:"sync"},()=>{DEVICES=Object.keys(ES.presenceState()).length;chip()});
  ES.subscribe(async st=>{
    if(st==="SUBSCRIBED"){SYNC="live";chip();try{await ES.track({device:/Mobi|Android|iPhone/.test(navigator.userAgent)?"mobile":"desktop",at:Date.now()})}catch(e){}}
    else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){SYNC="down";chip()}
  });
}

/* mutations: same call, local or server */
const DO={
  async order(c,extra){
    const body={key:c.key,type:c.type,lines:c.lines.map(l=>({id:l.id,size:l.size,addons:l.addons||[],qty:l.qty})),disc:c.disc,discType:c.discType,pay:c.pay,cust:c.cust,...extra};
    if(MODE==="server"){const o=await api("/api/orders","POST",body);await pull();return o}
    const dup=S.orders.find(o=>o.key===c.key);if(dup)return dup;
    for(const l of c.lines){const it=S.items.find(i=>i.id===l.id);if(it&&it.track&&it.stock<l.qty)throw new Error(it.name+": stock sirf "+it.stock+" bacha hai.")}
    const o=calcOrder({id:uid(),key:c.key,no:++S.seq,ts:Date.now(),type:c.type,lines:c.lines.map(l=>({...l})),disc:c.disc,discType:c.discType,pay:c.pay,status:"paid",by:S.me.name,cust:(c.cust.phone||c.cust.name)?{...c.cust}:null},S.settings,{items:S.items});
    o.lines.forEach(l=>{const p=partsOf(l.id);if(p)l.parts=p});
    if(c.pay==="cash"){o.cash=Math.round(+extra.cash||o.total);o.change=o.cash-o.total}else o.ref=extra.ref;
    o.lines.forEach(l=>takeStock(l.id,l.qty));(o.freeItems||[]).forEach(f=>takeStock(f.id,f.qty));
    o.cost=Math.round(o.lines.reduce((a,l)=>a+unitCost(l.id,l.size)*l.qty,0)+(o.freeItems||[]).reduce((a,f)=>a+unitCost(f.id,f.size)*f.qty,0));
    S.orders.push(o);saveLocal();return o;
  },
  async voidOrder(no,reason){
    if(MODE==="server"){await api("/api/orders/"+no+"/void","POST",{reason});return pull()}
    const o=S.orders.find(x=>x.no==no);o.status="void";o.voidReason=reason;o.voidBy=S.me.name;
    o.lines.forEach(l=>takeStock(l.id,-l.qty));(o.freeItems||[]).forEach(f=>takeStock(f.id,-f.qty));saveLocal();
  },
  async saveItem(it){
    if(MODE==="server"){await api("/api/items","POST",it);return pull()}
    const ex=S.items.findIndex(i=>i.id===it.id);ex>=0?S.items[ex]=it:S.items.push(it);saveLocal();
  },
  async delItem(id){if(MODE==="server"){await api("/api/items/"+id,"DELETE");return pull()}S.items=S.items.filter(i=>i.id!==id);saveLocal()},
  async restock(id,q){if(MODE==="server"){await api("/api/items/"+id+"/restock","POST",{qty:q});return pull()}S.items.find(i=>i.id===id).stock+=q;saveLocal()},
  async settings(s){if(MODE==="server"){S.settings=await api("/api/settings","PUT",s);return}Object.assign(S.settings,s);saveLocal()}
};

const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()};
const paid=()=>S.orders.filter(o=>o.status==="paid");
function canProfit(){if(!S)return false;if(MODE==="local")return UI.role==="owner"||!!(((S.settings.perms||{})[UI.role]||{}).profit);return !!(S.me&&S.me.profit)}
function unitCost(id,size){const it=S.items.find(i=>i.id===id);if(!it)return 0;const sc=it.sizeCosts||{};if(size&&sc[size]!=null&&sc[size]!=="")return +sc[size];if(it.cost!=null&&it.cost!=="")return +it.cost;if(it.components&&it.components.length)return it.components.reduce((a,c)=>a+unitCost(c.id,c.size)*(c.qty||1),0);return 0}
function partsOf(id){const it=S.items.find(i=>i.id===id);if(!it||!it.components||!it.components.length)return null;return it.components.map(c=>{const x=S.items.find(i=>i.id===c.id);return{name:(x?x.name:"?")+(c.size?" ("+c.size+")":""),qty:c.qty||1}})}
function takeStock(id,q){const it=S.items.find(i=>i.id===id);if(!it)return;if(it.components&&it.components.length){it.components.forEach(c=>takeStock(c.id,(c.qty||1)*q));return}if(it.track)it.stock-=q}
function lowList(){return S.items.filter(i=>i.track&&i.stock<=S.settings.lowStock)}

  const wk=P.filter(o=>o.ts>Date.now()-7*864e5);const cnt={};wk.forEach(o=>o.lines.forEach(l=>{cnt[l.name]=(cnt[l.name]||0)+l.qty}));

  </div>

    <div class="tools one"><div class="scan">${svg("scan")}<input class="in" id="q" placeholder="Item dhoondein · ya code / barcode + Enter (BG02, PZ04M)" value="${esc(UI.q)}" autocomplete="off" enterkeyhint="go"></div></div>

  $("#q").addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const v=e.target.value.trim();if(!v)return;const lv=v.toLowerCase();
    const exact=S.items.some(i=>(i.barcode&&i.barcode===v)||i.code.toLowerCase()===lv||(i.sizes&&lv.startsWith(i.code.toLowerCase())&&i.sizes.some(z=>z.l.toLowerCase()===lv.slice(i.code.length))));

function renderGrid(){
  const q=UI.q.trim().toLowerCase();
  const list=S.items.filter(i=>(UI.cat==="All"||i.cat===UI.cat)&&(!q||i.name.toLowerCase().includes(q)||i.code.toLowerCase().includes(q)||(i.barcode&&i.barcode===UI.q.trim())));
  $("#grid").innerHTML=list.length?list.map(i=>{const out=i.track&&i.stock<=0;const multi=i.sizes&&i.sizes.length>1;
    return `<button class="tile ${out?"out":""}" data-add="${i.id}" ${out?"disabled":""}><span class="code">${esc(i.code)}</span>${i.track?`<span class="st pill ${i.stock<=0?"bad":i.stock<=S.settings.lowStock?"warn":"ok"}">${i.stock}</span>`:""}<span class="nm">${esc(i.name)}</span>${multi?`<span class="sz">${esc(i.sizes.map(z=>z.l).join(" · "))}</span>`:""}${i.addons&&i.addons.length?`<span class="sz">+ add-ons</span>`:""}<span class="pr num">${multi?"<small>se</small>":""}${pkr(minPrice(i))}</span></button>`}).join(""):S.items.length?`<div class="empty" style="grid-column:1/-1">Koi item nahi mila</div>`:`<div class="empty" style="grid-column:1/-1;line-height:1.7">Menu abhi khaali hai.<br>${UI.role!=="cashier"?`<button class="btn y" id="emptyImp" style="margin-top:10px">Menu ki photo se items daalein</button>`:"Owner ya manager menu daalega."}</div>`;

function pickItem(id,fromScan,presetSize){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const multi=it.sizes&&it.sizes.length>1,adds=it.addons&&it.addons.length;
  if(!multi&&!adds)return addItem(it,it.sizes?it.sizes[0].l:null,fromScan,[]);
  let size=presetSize||(it.sizes?(multi?null:it.sizes[0].l):null);const chosen=new Set();
  const m=modal(`<h2>${esc(it.name)}</h2>${multi?`<div class="muted" style="font-size:12px;font-weight:600;margin-bottom:8px">Size chunein</div><div class="sizes">${it.sizes.map(z=>`<button type="button" data-sz="${esc(z.l)}"><span>${esc(z.l)}</span><b class="num">${pkr(z.p)}</b></button>`).join("")}</div>`:""}
   ${adds?`<div class="adds">${it.addons.map((a,k)=>`<label><input type="checkbox" data-ad="${k}"> ${esc(a.l)} <b class="num">+ ${pkr(a.p)}</b></label>`).join("")}</div>`:""}
   <div class="row" style="justify-content:space-between;margin-top:16px"><b class="num" id="pk_t"></b><div class="row"><button class="btn" id="x" type="button">Wapas</button><button class="btn y" id="pk_ok" type="button">Cart mein dalen</button></div></div>`);
  const upd=()=>{m.querySelectorAll("[data-sz]").forEach(b=>b.classList.toggle("on",b.dataset.sz===size));
    const base=size&&it.sizes?it.sizes.find(z=>z.l===size).p:(it.sizes?0:it.price);const extra=[...chosen].reduce((a,k)=>a+it.addons[k].p,0);
    m.querySelector("#pk_t").textContent=size||!it.sizes?pkr(base+extra):"Size chunein";m.querySelector("#pk_ok").disabled=!!it.sizes&&!size};
  m.querySelector("#x").onclick=close;
  m.querySelectorAll("[data-sz]").forEach(b=>b.onclick=()=>{size=b.dataset.sz;upd();if(!adds){close();addItem(it,size,fromScan,[])}});
  m.querySelectorAll("[data-ad]").forEach(c=>c.onchange=()=>{c.checked?chosen.add(+c.dataset.ad):chosen.delete(+c.dataset.ad);upd()});
  m.querySelector("#pk_ok").onclick=()=>{close();addItem(it,size,fromScan,[...chosen].map(k=>it.addons[k].l))};
  upd();(m.querySelector("[data-sz]")||m.querySelector("#pk_ok")).focus();
}
function addItem(it,size,announce,addons){
  addons=(addons||[]).slice().sort();const key=addons.join(",");
  const c=UI.cart;const ex=c.lines.find(l=>l.id===it.id&&l.size===size&&(l.addons||[]).join(",")===key);
  if(it.track&&(ex?ex.qty:0)+1>it.stock){toast(it.name+": stock khatam",true);return}
  const z=size&&it.sizes?it.sizes.find(s=>s.l===size):null;
  const extra=addons.reduce((a,l)=>a+((it.addons||[]).find(x=>x.l===l)||{p:0}).p,0);
  ex?ex.qty++:c.lines.push({id:it.id,size,addons,name:it.name+(z?" ("+z.l+")":"")+(addons.length?" + "+addons.join(", "):""),price:(z?z.p:it.price)+extra,qty:1,cat:it.cat});
  renderCart();if(announce)toast("+ "+it.name+(size?" ("+size+")":""));
}
function scanCode(v){
  v=v.trim();if(!v)return;const lv=v.toLowerCase();
  let it=S.items.find(i=>i.barcode&&i.barcode===v)||S.items.find(i=>i.code.toLowerCase()===lv);
  if(it){if(UI.view!=="billing")go("billing");return pickItem(it.id,true)}
  /* code + size, e.g. PZ04M or SW032pc */
  for(const i of S.items){if(i.sizes&&lv.startsWith(i.code.toLowerCase())){const z=i.sizes.find(z=>z.l.toLowerCase()===lv.slice(i.code.length));if(z){if(UI.view!=="billing")go("billing");return i.addons&&i.addons.length?pickItem(i.id,true,z.l):addItem(i,z.l,true,[])}}}
  toast("Code nahi mila: "+v,true);
}

function payModal(){
  const c=UI.cart,t=cartTotals();
  if(c.type==="Delivery"&&!c.cust.phone.trim()){toast("Delivery ke liye phone number likhein",true);$("#cphone").focus();return}
  const qs=[t.total,...[500,1000,2000,5000].filter(x=>x>t.total)].slice(0,4);
  const o=modal(`<h2>Payment · ${c.pay==="cash"?"Cash":"Card / QR"}</h2>
   <div class="sum" style="font-size:16px;margin-bottom:12px"><span>Total</span><b class="num">${pkr(t.total)}</b></div>
   ${c.pay==="cash"?`<label class="f">Customer ne diye (PKR)<input class="in num" id="recv" inputmode="decimal" autofocus value="${t.total}"></label>
   <div class="quick" style="margin:10px 0">${qs.map(q=>`<button class="btn sm" data-qk="${q}">${q.toLocaleString()}</button>`).join("")}</div>
   <div class="muted">Wapsi (change)</div><div class="change num" id="chg">PKR 0</div>`:`<p class="muted">Card machine / QR par payment confirm hone ke baad hi Confirm dabayen. Yeh software khud bank se payment verify nahi karta.</p><label class="f">Reference / last 4 digits (optional)<input class="in" id="ref" autofocus></label>`}
   <p id="perr" style="color:var(--bad);min-height:18px"></p>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="x">Wapas</button><button class="btn y" id="ok">Confirm &amp; receipt</button></div>`);
  const recv=o.querySelector("#recv"),ok=o.querySelector("#ok");
  const upd=()=>{const ch=(+recv.value||0)-t.total;o.querySelector("#chg").textContent=ch>=0?pkr(ch):"Kam hain: "+pkr(-ch);ok.disabled=ch<0};
  if(recv){recv.oninput=upd;upd();recv.select();o.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{recv.value=b.dataset.qk;upd()})}
  o.querySelector("#x").onclick=close;
  ok.onclick=()=>busy(ok,async()=>{
    try{const ord=await DO.order(c,recv?{cash:+recv.value}:{ref:o.querySelector("#ref").value});
      UI.cart=newCart();close();renderGrid();renderCart();receipt(ord);
    }catch(e){o.querySelector("#perr").textContent=e.message}
  });
  o.addEventListener("keydown",e=>{if(e.key==="Enter"&&!ok.disabled&&e.target.tagName!=="BUTTON"){e.preventDefault();ok.click()}});

function receiptHTML(o){
  const s=S.settings,r={...DEF_RC,...(s.receipt||{})};
  return `<div class="rc ${s.width} f${r.font}">${r.logo?`<img class="l${r.logoSize}${LOGO!==DEF_LOGO?" custom":""}" src="${LOGO!==DEF_LOGO?LOGO:DEF_RC_LOGO}" alt="">`:""}<div class="c">${esc(s.tagline)}${r.header?`<br><b>${esc(r.header)}</b>`:""}${r.showAddress&&s.address?`<br>${esc(s.address)}`:""}${r.showPhone&&s.phone?`<br>${esc(s.phone)}`:""}${s.ntn?`<br>PRA/NTN: ${esc(s.ntn)}`:""}</div><hr>
  <div class="r"><span>Order ${ono(o.no)}</span><span>${o.type}</span></div><div>${new Date(o.ts).toLocaleString("en-GB")}</div>${r.showCashier?`<div>Cashier: ${esc(o.by)}</div>`:""}${r.showCustomer&&o.cust?`<div>Customer: ${esc(o.cust.name)} ${esc(o.cust.phone)}</div>`:""}<hr>
  ${o.lines.map(l=>`<div>${esc(l.name)}</div>${(l.parts||[]).map(p=>`<div style="padding-left:10px;font-size:.9em">- ${p.qty*l.qty} x ${esc(p.name)}</div>`).join("")}<div class="r"><span>${l.qty} x ${l.price}</span><span>${(l.qty*l.price).toLocaleString()}</span></div>`).join("")}
  ${(o.free||[]).map(f=>`<div class="r"><span>${esc(f.name)} x${f.qty}</span><span>FREE</span></div>`).join("")}<hr>
  <div class="r"><span>Subtotal</span><span>${o.sub.toLocaleString()}</span></div>
  ${o.offerAmt?`<div class="r"><span>Offer discount</span><span>-${o.offerAmt.toLocaleString()}</span></div>`:""}
  ${(o.offers||[]).map(x=>`<div class="r"><span>${esc(x.name)}</span><span>-${(+x.amt).toLocaleString()}</span></div>`).join("")}
  ${o.discAmt?`<div class="r"><span>Discount</span><span>-${Math.round(o.discAmt).toLocaleString()}</span></div>`:""}
  ${r.showTaxLine?`<div class="r"><span>PRA Tax ${o.taxRate}% ${s.taxOnTop?"":"(incl.)"}</span><span>${o.tax.toLocaleString()}</span></div>`:""}
  ${o.fee?`<div class="r"><span>Delivery charges</span><span>${o.fee}</span></div>`:""}<hr>
  <div class="r big ${r.boldTotal?"":"nobold"}"><span>TOTAL PKR</span><span>${o.total.toLocaleString()}</span></div>
  ${o.cash!=null?`<div class="r"><span>Cash</span><span>${o.cash.toLocaleString()}</span></div><div class="r"><span>Change</span><span>${o.change.toLocaleString()}</span></div>`:`<div class="r"><span>Paid by</span><span>Card/QR</span></div>`}
  ${o.status==="void"?`<div class="c big">*** VOID ***</div>`:""}<hr><div class="c">${esc(s.footer)}</div></div>`;
}
function receipt(o){
  const m=modal(`<h2>Receipt</h2>${receiptHTML(o)}
   <p class="muted" style="font-size:12px;margin-top:12px">${inFrame?"Is preview mein print band hai. App ko Windows par kholen to thermal printer par print hoga.":"Print dabane par thermal printer select karein (pehli dafa default bana dein)."}</p>
   <div class="row" style="justify-content:flex-end;margin-top:8px">${inFrame?"":`<button class="btn" id="pr">Print</button>`}<button class="btn y" id="x" autofocus>Agla order</button></div>`);
  m.querySelector("#x").onclick=()=>{close();$("#q")&&$("#q").focus()};
  const p=m.querySelector("#pr");p&&(p.onclick=()=>{$("#printArea").innerHTML=receiptHTML(o);window.print()});
}

/* ============ orders ============ */
function vOrders(){
  const r=UI.range;const tk=dayKey(Date.now()),wk=Date.now()-7*864e5;
  const list=S.orders.filter(o=>r==="all"||(r==="today"?dayKey(o.ts)===tk:o.ts>wk)).slice().reverse();
  const tot=list.filter(o=>o.status==="paid").reduce((s,o)=>s+o.total,0);const prof=list.filter(o=>o.status==="paid").reduce((s,o)=>s+o.total-o.tax-(o.fee||0)-(o.cost||0),0);
  $("#view").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg" id="rng" style="min-width:240px">${[["today","Aaj"],["week","7 din"],["all","Sab"]].map(([k,l])=>`<button class="${r===k?"on":""}" data-v="${k}">${l}</button>`).join("")}</div><b class="num">${list.length} orders · ${pkr(tot)}${canProfit()?` · profit ${pkr(prof)}`:""}</b></div>

function itemForm(it,preset){

  const cats=[...new Set(S.items.map(i=>i.cat))];const sz=(it.sizes||[]).concat([{l:"",p:""},{l:"",p:""},{l:"",p:""}]).slice(0,Math.max(3,(it.sizes||[]).length));const ad=(it.addons||[]).concat([{l:"",p:""},{l:"",p:""},{l:"",p:""}]).slice(0,Math.max(3,(it.addons||[]).length+1));const cm=(it.components||[]).concat([{},{},{},{}]).slice(0,Math.max(4,(it.components||[]).length+1));

   <div class="full"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Add-ons (Extra Cheese +100, Extra Dip +50) · customer ek se zyada chun sakta hai</div>
    <div style="display:grid;gap:6px">${ad.map((a,k)=>`<div class="addrow"><input class="in" id="a_l${k}" placeholder="Add-on" value="${esc(a.l)}"><input class="in" id="a_p${k}" type="number" min="0" placeholder="+ Rate" value="${a.p}"></div>`).join("")}</div></div>
   ${canProfit()?`<div class="full card" style="background:var(--bg)"><h3 style="font-size:16px">Lagat (cost price) <span class="pill y">sirf aap ko nazar aati hai</span></h3>
    <div class="fgrid"><label class="f">Cost · ek size ho to<input class="in" id="i_cost" type="number" min="0" value="${it.cost??""}" placeholder="Rs"></label>
    ${sz.map((z,k)=>`<label class="f">Cost · size ${k+1}<input class="in" id="zc${k}" type="number" min="0" value="${z.l&&it.sizeCosts&&it.sizeCosts[z.l]!=null?it.sizeCosts[z.l]:""}" placeholder="Upar wale size ${k+1} ki lagat"></label>`).join("")}</div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Deal / combo ki lagat khali chhorein to us ke items ki lagat jor kar nikal li jayegi.</p></div>`:""}

    <div style="display:grid;gap:6px" id="cmp">${cm.map((c,k)=>`<div class="cmprow" style="display:grid;grid-template-columns:2fr 1fr 70px;gap:6px"><select class="sel" id="c_i${k}"><option value="">— item —</option>${S.items.filter(x=>x.id!==it.id&&!(x.components&&x.components.length)).map(x=>`<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><select class="sel" id="c_s${k}" data-sel="${esc(c.size||"")}"></select><input class="in" id="c_q${k}" type="number" min="1" value="${c.qty||1}"></div>`).join("")}</div>
    <p class="muted" style="font-size:12px;margin:6px 0 0">Deal bechne par in items ka stock aur lagat khud kat jayegi. Receipt par items bhi likhe ayenge.</p></div>

    if(!sizes.length&&!(price>0))return err("Rate likhein, ya sizes ke rate dalein.");
    if(S.items.some(i=>i.id!==it.id&&i.code.toLowerCase()===code.toLowerCase()))return err("Yeh code pehle se kisi aur item ka hai.");
    if(bar&&S.items.some(i=>i.id!==it.id&&i.barcode===bar))return err("Yeh barcode pehle se istemal ho raha hai.");

    it.components=cm.map((_,k)=>({id:v("#c_i"+k),size:v("#c_s"+k)||null,qty:Math.max(1,+v("#c_q"+k)||1)})).filter(c=>c.id);if(!it.components.length)it.components=null;else it.track=false;

    busy(m.querySelector("#sv"),async()=>{try{await DO.saveItem(it);close();UI.view==="settings"?vSet():vMenu();toast("Saved")}catch(e){err(e.message)}});
  };
}

/* RestoPulse: turn OCR text of a menu photo into items. Owner checks the list before it is saved. */
const MENU_CAT_WORDS = ["pizza","pizzas","burger","burgers","wrap","wraps","roll","rolls","sandwich","sandwiches","shawarma","shawarmas","pasta","pastas","drink","drinks","beverage","beverages","deal","deals","combo","combos","side","sides","sided","starter","starters","starts","appetizer","appetizers","fries","bbq","karahi","handi","rice","biryani","dessert","desserts","sweet","sweets","shake","shakes","juice","juices","tea","coffee","chinese","soup","soups","salad","salads","breakfast","platter","platters","steak","steaks","wings","snack","snacks","special","specials","main","course","menu","extra","extras","add","ons","addons","naan","roti","bread","breads","broast","fried","chicken","grill","grilled","tikka","kabab","kebab","paratha","family","kids","hot","cold","ice","cream","&","/","and","+","our","item","items"];
const SIZE_WORDS = {s:"S",m:"M",l:"L",xl:"XL",small:"Small",medium:"Medium",large:"Large",regular:"Regular",reg:"Regular",half:"Half",full:"Full",single:"Single",double:"Double",quarter:"Quarter"};
function mpTitle(s){return s.toLowerCase().replace(/(^|[\s/&(+-])([a-z])/g,(a,b,c)=>b+c.toUpperCase()).replace(/\bAk47\b/gi,"AK47").replace(/\bBbq\b/g,"BBQ")}
function mpSizeHeader(line){
  // a row like "S M L", "Small Medium Large", "2pc 3pc", 7" 10" 13"
  const t=line.replace(/[^\w"'\s]/g," ").trim().split(/\s+/).filter(Boolean);
  if(t.length<2||t.length>5)return null;
  const out=[];
  for(const w of t){const lw=w.toLowerCase().replace(/['"]/g,"");
    if(SIZE_WORDS[lw])out.push(SIZE_WORDS[lw]);
    else if(/^\d{1,2}(pc|pcs|piece|pieces|"|inch|in|ml|ltr|l)$/i.test(w))out.push(w.replace(/pieces?$/i,"pc").replace(/pcs$/i,"pc"));
    else return null}
  return out.length>=2?out:null;
}
function mpIsCategory(name, hasPrice){
  const words=name.toLowerCase().replace(/[^a-z&/+ ]/g," ").split(/\s+/).filter(Boolean);
  if(!words.length||words.length>4)return false;
  const allCat=words.every(w=>MENU_CAT_WORDS.includes(w));
  const letters=name.replace(/[^A-Za-z]/g,"");
  const upper=letters.length>=3&&letters===letters.toUpperCase();
  const HEAD=["sided","starts","starters","sides","deals","drinks","beverages","extras","desserts","appetizers","burgers","pizzas","wraps","rolls","sandwiches","shakes","juices","soups","salads","snacks","specials","platters","steaks","combos","breads","sweets","menu"];
  if(allCat&&(upper||words.some(w=>HEAD.includes(w))))return true;
  if(!hasPrice&&upper&&words.length<=3)return true;
  return false;
}
function parseMenuText(text){
  const items=[];let cat="",sizes=null,pending=null;
  const lines=String(text).replace(/\r/g,"").split("\n");
  for(let raw of lines){
    let line=raw.replace(/[“”«»‘’]/g," ").replace(/\b(rs|pkr)\.?\s*/gi," ").replace(/(\d)\s*\/\s*-?/g,"$1 ").replace(/(\d),(?=\s|$)/g,"$1").replace(/\s+/g," ").trim();
    if(!line)continue;
    const sh=mpSizeHeader(line);if(sh){sizes=sh;continue}
    const tok=line.split(" ");
    // last token that is a real word (3+ letters, or letters+digits like 5Pc / AK47)
    let lw=-1;
    for(let i=0;i<tok.length;i++){const w=tok[i].replace(/^[^A-Za-z0-9(]+|[^A-Za-z0-9)]+$/g,"");
      if(/[A-Za-z]{3,}/.test(w)||/^AK\d+$/i.test(w)||/^\d+(pc|pcs|ml|ltr|l|kg|g)$/i.test(w)||/^\(.*\)$/.test(tok[i]))lw=i;}
    const head=lw>=0?tok.slice(0,lw+1).join(" "):"";
    const tail=lw>=0?tok.slice(lw+1):tok;
    const slots=[];
    for(const t of tail){const c=t.replace(/^[^\d-–—]+|[^\d]+$/g,"");
      if(/^[-–—]+$/.test(t.trim())){slots.push(null);continue}
      if(/^\d{2,5}$/.test(c)&&!/[A-Za-z]/.test(t)){const n=+c;if(n>=10&&n<=99999)slots.push(n)}}
    while(slots.length&&slots[0]===null&&slots.slice(1).every(x=>x===null))slots.shift();
    const prices=slots.filter(x=>x!==null);
    let name=head.replace(/^[^A-Za-z0-9(]+/,"").replace(/[^A-Za-z0-9)]+$/,"").replace(/\s+[^\sA-Za-z0-9()+&]+(?=\s|$)/g,"").trim();
    // OCR leaves short junk after the name ("Masala Fries Shy", "Roll P47"): drop it
    const KEEP=["dip","tea","hot","ice","egg","bun","pie","bbq","mix","veg","jam","cup","pc","ml","h","f"];
    let nt=name.split(" ");
    while(nt.length>1){const w=nt[nt.length-1];const lw2=w.toLowerCase().replace(/[^a-z0-9]/g,"");
      if(/\)$/.test(w)&&/\(/.test(nt.join(" ")))break;
      if((lw2.length<=3&&!KEEP.includes(lw2)&&!/^\d+(pc|ml|l)$/.test(lw2))||/^[a-z]{1,2}\d+\)?$/i.test(lw2)&&!/^ak\d+$/i.test(lw2)){nt.pop();continue}
      break}
    name=nt.join(" ").replace(/[^A-Za-z0-9)]+$/,"");
    // "WRAP Ses": category word in capitals at the start, junk after it
    if(!prices.length){const lead=[];for(const w of name.split(" ")){if(w===w.toUpperCase()&&MENU_CAT_WORDS.includes(w.toLowerCase()))lead.push(w);else break}
      if(lead.length&&lead.join("").length>=3)name=lead.join(" ")}
    if(!name&&prices.length){ // price on its own line: belongs to the item above
      if(pending){pending.slots=slots;finish(pending);pending=null}
      continue}
    if(!name)continue;
    if(mpIsCategory(name,prices.length>0)){cat=mpTitle(name.replace(/[^A-Za-z&/ ]/g," ").replace(/\s+/g," ").trim());sizes=null;if(pending){items.push(pending);pending=null}continue}
    if(!prices.length){if(pending)items.push(pending);pending={name,cat,slots:[],sizesHint:sizes,noPrice:true};continue}
    if(pending){items.push(pending);pending=null}
    finish({name,cat,slots,sizesHint:sizes});
  }
  if(pending)items.push(pending);
  function finish(it){
    const s=it.slots;const real=s.filter(x=>x!==null);
    it.noPrice=!real.length;
    if(s.length===1||real.length===1&&!(it.sizesHint&&s.length===it.sizesHint.length)){it.price=real[0]||0;it.sizes=null}
    else if(real.length){
      const labels=it.sizesHint&&it.sizesHint.length===s.length?it.sizesHint:s.length===3?["S","M","L"]:s.length===2?["Regular","Large"]:s.map((_,k)=>"Size "+(k+1));
      it.sizes=s.map((p,k)=>p===null?null:{l:labels[k],p}).filter(Boolean);it.price=0}
    items.push(it);
  }
  const seen=new Set();
  return items.map(it=>({name:it.name.replace(/\s+/g," ").trim(),cat:it.cat||"Menu",price:it.price||0,sizes:it.sizes||null,ok:!it.noPrice}))
    .filter(it=>it.name.replace(/[^A-Za-z]/g,"").length>=3)
    .filter(it=>{const k=(it.name+"|"+it.price+"|"+JSON.stringify(it.sizes)).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}

/* ============ menu from photos (free OCR in the browser) ============ */
let TESS=null,TWORK=null;
function loadTesseract(){if(window.Tesseract)return Promise.resolve();if(TESS)return TESS;

async function shrinkPhoto(file,max){ // phone photos are 12+ MP; work on a 2200px copy so nothing lags
  let src;try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(new Error("Photo khul nahi saki."));im.src=URL.createObjectURL(file)})}
  const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement("canvas");c.width=Math.round(w0*k);c.height=Math.round(h0*k);
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(src,0,0,c.width,c.height);src.close&&src.close();
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return{canvas:c,url:URL.createObjectURL(blob),w:c.width,h:c.height}}
function prepCanvas(srcC,r){ // crop, upscale to ~2x, grayscale, stretch contrast: far better OCR on coloured menus
  const sx=Math.round(r.x*srcC.width),sy=Math.round(r.y*srcC.height),sw=Math.max(8,Math.round(r.w*srcC.width)),sh=Math.max(8,Math.round(r.h*srcC.height));
  const k=Math.max(1,Math.min(2,2400/sw,3600/sh));const c=document.createElement("canvas");c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const g=c.getContext("2d",{willReadFrequently:true});g.imageSmoothingQuality="high";g.drawImage(srcC,sx,sy,sw,sh,0,0,c.width,c.height);
  const d=g.getImageData(0,0,c.width,c.height),a=d.data,n=a.length;let lo=255,hi=0;
  for(let i=0;i<n;i+=4){const v=(a[i]*77+a[i+1]*150+a[i+2]*29)>>8;a[i]=v;if(v<lo)lo=v;if(v>hi)hi=v}
  const sc=hi>lo?255/(hi-lo):1;for(let i=0;i<n;i+=4){const v=(a[i]-lo)*sc;a[i]=a[i+1]=a[i+2]=v}
  g.putImageData(d,0,0);return c}
function rateText(it){return it.sizes&&it.sizes.length?it.sizes.map(z=>z.l+" "+z.p).join(" / "):(it.price?String(it.price):"")}
function readRate(t){t=String(t||"").trim();if(!t)return null;
  if(/^\d+$/.test(t))return{price:+t,sizes:null};
  const parts=t.split(/[\/,|]+/).map(x=>x.trim()).filter(Boolean),sizes=[];
  for(const p of parts){const m=p.match(/^(.*?)[\s:=-]*(\d{1,6})$/);if(!m||!m[1].trim())return null;sizes.push({l:m[1].replace(/[:=-]+$/,"").trim().slice(0,20),p:+m[2]})}
  return sizes.length===1?{price:sizes[0].p,sizes:null}:{price:0,sizes}}

   <div class="full" id="o_fw"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Free kya milega</div><div style="display:grid;grid-template-columns:2fr 1fr 70px;gap:6px"><select class="sel" id="o_fi"><option value="">— item —</option>${S.items.map(i=>`<option value="${i.id}" ${i.id===o.free.id?"selected":""}>${esc(i.name)}</option>`).join("")}</select><select class="sel" id="o_fs"></select><input class="in" id="o_fq" type="number" min="1" value="${o.free.qty||1}"></div><p class="muted" style="font-size:12px;margin:6px 0 0">"Poore bill par" ho to bill par ek dafa milega; categories/items ho to har qualifying item ke saath.</p></div>
   <div class="full"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Kin dinon (koi na chunein = roz)</div><div class="offcats">${DAYS.map((d,k)=>`<label><input type="checkbox" data-od="${k}" ${(o.days||[]).map(Number).includes(k)?"checked":""}> ${d}</label>`).join("")}</div></div>
   <label class="f">Waqt se<input class="in" id="o_from" type="time" value="${o.from||""}"></label>
   <label class="f">Waqt tak<input class="in" id="o_to" type="time" value="${o.to||""}"></label>

   <label class="f">Tareekh tak<input class="in" id="o_en" type="date" value="${o.end||""}"></label>

  const q=x=>m.querySelector(x);q("#o_tp").value=o.type;q("#o_sc").value=o.scope||"bill";
  const fs=()=>{const x=S.items.find(i=>i.id===q("#o_fi").value);q("#o_fs").innerHTML=x&&x.sizes?x.sizes.map(z=>`<option ${z.l===o.free.size?"selected":""}>${esc(z.l)}</option>`).join(""):`<option value="">—</option>`};
  const sync=()=>{const t=q("#o_tp").value,sc=q("#o_sc").value;q("#o_vw").hidden=t==="free";q("#o_vw").firstChild.textContent=t==="pct"?"Kitna %":"Kitne Rs";q("#o_fw").hidden=t!=="free";q("#o_cw").hidden=sc!=="cats";q("#o_iw").hidden=sc!=="items"};
  fs();sync();q("#o_fi").onchange=fs;q("#o_tp").onchange=sync;q("#o_sc").onchange=sync;q("#x").onclick=close;
  const del=q("#o_del");del&&(del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent="Pakka delete?";return}busy(del,async()=>{L.splice(idx,1);await DO.settings({offers:L});close();offCard();toast("Offer delete")})});
  q("#off").onsubmit=e=>{e.preventDefault();const err=t=>q("#oerr").textContent=t;
    const x={id:o.id,name:q("#o_nm").value.trim(),on:q("#o_on2").checked,type:q("#o_tp").value,scope:q("#o_sc").value,value:+q("#o_v").value||0,minBill:+q("#o_min").value||0,
      cats:[...m.querySelectorAll("[data-oc2]")].filter(i=>i.checked).map(i=>i.dataset.oc2),items:[...m.querySelectorAll("[data-oi]")].filter(i=>i.checked).map(i=>i.dataset.oi),
      free:{id:q("#o_fi").value,size:q("#o_fs").value||null,qty:Math.max(1,+q("#o_fq").value||1)},days:[...m.querySelectorAll("[data-od]")].filter(i=>i.checked).map(i=>+i.dataset.od),
      from:q("#o_from").value,to:q("#o_to").value,start:q("#o_st").value,end:q("#o_en").value};
    if(!x.name)return err("Naam likhein.");
    if(x.type!=="free"&&!(x.value>0))return err("Discount kitna hai, likhein.");
    if(x.type==="pct"&&x.value>100)return err("% 100 se zyada nahi ho sakta.");
    if(x.type==="free"&&!x.free.id)return err("Free item chunein.");
    if(x.scope==="cats"&&!x.cats.length)return err("Kam se kam ek category chunein.");
    if(x.scope==="items"&&!x.items.length)return err("Kam se kam ek item chunein.");
    if(!!x.from!==!!x.to)return err("Waqt se aur tak dono likhein, ya dono khali.");
    if(x.start&&x.end&&x.end<x.start)return err("Akhri tareekh pehli se pehle hai.");
    if(x.type!=="free")x.free=null;
    n?L.push(x):L[idx]=x;
    busy(q("#o_sv"),async()=>{try{await DO.settings({offers:L});close();offCard();renderCart&&$("#cart")&&renderCart();toast("Offer save ho gaya")}catch(e){err(e.message)}});
  };
}

/* ============ subscription screens ============ */
let PLANPOLL=null,DEFERRED=null;
async function enter(){
  clearInterval(PLANPOLL);
  let me=await api("/api/me");
  if(!me.member){if(me.admin){location.href="admin.html";return}return noBusinessScreen(me)}
  if(!me.active)return noBusinessScreen(me);
  if(me.businessStatus!=="active"){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Account band hai</h3><p class="muted">Yeh business account band kiya gaya hai. Support se rabta karein.</p><button class="btn" onclick="logout()">Logout</button></div></div>`;return}
  if(me.sub.status!=="active")return expiredScreen(me);
  if(me.me.mustChange){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"></div></div>`;return changePwModal(true,()=>enter())}
  await pull();startSync();$("#root").innerHTML="";render();
}
function expiryPill(){if(!S||!S.sub||!S.sub.expires)return"";const d=Math.ceil((S.sub.expires-Date.now())/864e5);const tr=S.sub.plan&&S.sub.plan.id==="trial";return tr?`<span class="pill ${d<=2?"warn":"y"}">Free trial · ${d} din baqi</span>`:d<=5?`<span class="pill warn">Plan ${d} din mein khatam</span>`:""}
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED=e;document.querySelectorAll(".inst").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true);toast("RestoPulse install ho gaya")});
function installBtn(){return MODE==="server"&&!isStandalone()?`<button type="button" class="btn sm inst" ${DEFERRED?"":"hidden"} onclick="doInstall()">Computer / mobile par install karein</button>`:""}
async function doInstall(){if(!DEFERRED)return;DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true)}
function contactLine(c){c=String(c||"");const re=/(\+?92[-\s]?|0)3\d{2}[-\s]?\d{7}/;const wl=c.split("\n").find(l=>/whats\s*app/i.test(l)&&re.test(l));const ph=((wl||c).match(re)||[])[0];return{text:c,wa:ph?"https://wa.me/"+ph.replace(/\D/g,"").replace(/^0/,"92"):""}}
function expiredScreen(me){
  clearInterval(PLANPOLL);if(ES&&SB){SB.removeChannel(ES);ES=null}
  const sub=me.sub||{},trial=sub.plan&&sub.plan.id==="trial",d=t=>new Date(t).toLocaleDateString("en-GB"),c=contactLine(me.contact);
  $("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse">
   <h3 style="text-align:center">${trial?"Free trial khatam":"Plan khatam"}</h3>
   <p class="muted" style="text-align:center;margin-top:-6px">${esc(me.business.name)} · ${esc(me.me.name)}</p>
   <p style="line-height:1.7">${trial?"Aap ka 7 din ka free trial":"Aap ka plan"}${sub.expires?" "+d(sub.expires)+" ko":""} khatam ho gaya. Aap ka sara data mehfooz hai. Payment hote hi software wapas khul jayega.</p>
   ${me.me.role==="owner"?`<div class="card" style="background:var(--bg)"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Payment aur plan ke liye rabta</div><div class="payinfo">${esc(c.text||"RestoPulse team se rabta karein.")}</div></div>`:`<p class="muted">Owner se kahen ke RestoPulse team se rabta kare.</p>`}
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${c.wa&&me.me.role==="owner"?`<a class="btn y" href="${c.wa}" target="_blank" rel="noopener">WhatsApp par rabta</a>`:""}
   <button class="btn" id="chk">Dobara check karein</button><button class="btn" id="lo2">Logout</button></div></div></div>`;
  $("#lo2").onclick=()=>logout();$("#chk").onclick=()=>enter();
  PLANPOLL=setInterval(async()=>{try{const m2=await api("/api/me");if(m2.sub&&m2.sub.status==="active"){clearInterval(PLANPOLL);toast("Account khul gaya");enter()}}catch(e){}},30000);
}

/* ============ first login: owner sets his own password ============ */
function changePwModal(force,done){
  const m=modal(`<h2>${force?"Apna naya password banayen":"Mera password badlein"}</h2>
   <p class="muted" style="margin-top:-6px">${force?"Pehli dafa login hua hai. Aage se sirf aap ka apna password chalega.":"Naya password kam az kam 8 huroof ka ho."}</p>
   <form id="cpf" style="display:flex;flex-direction:column;gap:12px">
   <label class="f">Naya password<input class="in" id="cp1" type="password" minlength="8" required autocomplete="new-password" autofocus></label>
   <label class="f">Naya password dobara<input class="in" id="cp2" type="password" minlength="8" required autocomplete="new-password"></label>
   <p id="cperr" style="color:var(--bad);margin:0;min-height:18px"></p>
   <div class="row" style="justify-content:flex-end">${force?`<button type="button" class="btn" id="cplo">Logout</button>`:`<button type="button" class="btn" id="x">Wapas</button>`}<button class="btn y" id="cpsv">Password save karein</button></div></form>`);
  if(force){const ov=$("#ov");ov&&(ov.dataset.lock="1");m.querySelector("#cplo").onclick=()=>logout()}else m.querySelector("#x").onclick=close;
  m.querySelector("#cpf").onsubmit=e=>{e.preventDefault();const p1=m.querySelector("#cp1").value,err=t=>m.querySelector("#cperr").textContent=t;
    if(p1!==m.querySelector("#cp2").value)return err("Dono password ek jaise nahi.");
    if(p1.length<8)return err("Password kam az kam 8 huroof ka ho.");
    busy(m.querySelector("#cpsv"),async()=>{try{
      if(MODE==="local"){const u=(S.users||[]).find(x=>x.id===S.me.id);if(u)u.password=p1;saveLocal()}
      else{const {error}=await SB.auth.updateUser({password:p1});if(error)throw new Error(/different from the old/i.test(error.message)?"Naya password purane se mukhtalif ho.":error.message);await rpc("password_changed")}
      close(true);toast("Password badal gaya");done&&done()}catch(x){err(x.message||String(x))}})};
}

/* ============ emailed link: verify email + get login once ============ */
function claimScreen(tok){
  $("#root").innerHTML=`<div class="auth"><div class="card" id="clc"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Email verify karein</h3>
   <p class="muted" style="line-height:1.6;text-align:center">Neeche button dabate hi aap ki email verify hogi aur aap ka username aur password dikhaya jayega. Yeh <b>sirf ek dafa</b> dikhega.</p>
   <p id="clerr" style="color:var(--bad);min-height:18px;margin:0"></p>
   <div style="display:flex;flex-direction:column;gap:10px"><button class="btn y" id="clb">Verify karein aur login dekhein</button><button class="btn" id="clskip">Login screen par jayen</button></div></div></div>`;
  const clear=()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}};
  $("#clskip").onclick=()=>{clear();authScreen()};
  $("#clb").onclick=()=>busy($("#clb"),async()=>{try{const r=await rpc("claim_account",{p_token:tok});clear();
    $("#clc").innerHTML=`<img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Email verify ho gayi</h3>
     <p class="muted" style="text-align:center;margin-top:-6px">${esc(r.business)} · ${esc(r.owner)} · 7 din free trial</p>
     <div class="card" style="background:var(--bg);font-size:16px;line-height:2"><div>Username: <b class="num" style="color:var(--y)">${esc(r.username)}</b></div><div>Password: <b class="num" style="color:var(--y)">${esc(r.password)}</b></div></div>
     <p class="muted" style="font-size:12px">Abhi note kar lein. Login ke baad aap ko apna naya password banana hoga.</p>
     <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="clcp">Copy</button><button class="btn y" id="clgo">Ab login karein</button></div>`;
    $("#clcp").onclick=async()=>{try{await navigator.clipboard.writeText("Username: "+r.username+"\nPassword: "+r.password);toast("Copy ho gaya")}catch(e){toast("Copy nahi hua, khud likh lein",true)}};
    $("#clgo").onclick=async()=>{await authScreen();const a=$("#a_login");a&&(a.value=r.username);const p=$("#a_pw");p&&p.focus()};
  }catch(x){$("#clerr").textContent=x.message||String(x)}});
}

/* ============ boot ============ */
(async()=>{
  const CFG=window.AK47_CONFIG;
  if(!inFrame&&CFG&&!window.supabase){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Internet nahi hai</h3><p class="muted" style="line-height:1.6">RestoPulse sirf online chalta hai. Internet check kar ke dobara kholen.</p><button class="btn y" style="width:100%" onclick="location.reload()">Dobara try karein</button></div></div>`;return}
  if(!inFrame&&CFG&&window.supabase){MODE="server";SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storage:AUTHSTORE}})}
  if(MODE==="server"){
    try{navigator.serviceWorker&&navigator.serviceWorker.register("./sw.js")}catch(e){}
    const cm=location.hash.match(/^#claim=([0-9a-f]{48})$/);
    if(cm){await SB.auth.signOut().catch(()=>{});return claimScreen(cm[1])}
    const {data}=await SB.auth.getSession();
    if(data.session){TOKEN="sb";try{await enter();return}catch(e){if(!TOKEN)return;$("#root").innerHTML=`<div class="auth"><div class="card"><h3>Rabta nahi ho saka</h3><p class="muted">${esc(e.message)}</p><button class="btn y" onclick="location.reload()">Dobara try karein</button></div></div>`;return}}
    return authScreen();
  }
  try{S=JSON.parse(ls.get(KEY)||"null")}catch(e){S=null}
  if(!S||!S.items){S=seedLocal();saveLocal()}
  if(!S.users)S.users=[{id:"u_owner",name:"Owner",login:"owner",password:"owner123",role:"owner",active:true}];
  const me=S.users.find(u=>u.id===ls.get("rp.demo.me")&&u.active);
  if(!me){S.me=null;return authScreen()}
  S.me={id:me.id,name:me.name,role:me.role};UI.role=me.role;
  render();
})();
